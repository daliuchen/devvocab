name: Build Extension Package

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-extension:
    name: Build Chrome extension zip
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Run tests
        run: npm run test

      - name: Build extension
        run: npm run build

      - name: Run lint
        run: npm run lint

      - name: Create Chrome Web Store zip
        run: |
          cd dist
          zip -r ../devvocab-extension.zip .

      - name: Upload extension package
        uses: actions/upload-artifact@v4
        with:
          name: devvocab-extension
          path: devvocab-extension.zip
          if-no-files-found: error
