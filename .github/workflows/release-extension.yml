name: Build Extension Package

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-extension:
    name: Build Chrome extension zip
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Run tests
        run: npm run test

      - name: Build extension
        run: npm run build

      - name: Run lint
        run: npm run lint

      - name: Create Chrome Web Store zip
        run: |
          cd dist
          zip -r ../readtrace-extension.zip .

      - name: Upload extension package
        uses: actions/upload-artifact@v4
        with:
          name: readtrace-extension
          path: readtrace-extension.zip
          if-no-files-found: error

      - name: Upload package to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: readtrace-extension.zip
          generate_release_notes: true

      - name: Upload package to latest GitHub Release
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest extension build
          body: |
            Automated extension package from `${{ github.sha }}`.

            Use version tags like `v0.1.0` for stable releases.
          files: readtrace-extension.zip
          prerelease: true
          make_latest: false
